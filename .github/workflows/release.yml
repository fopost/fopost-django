name: Release

# Tag the commit as v<version> matching pyproject.toml, e.g. v0.1.0.
# Publishing uses PyPI trusted publishing — configure the publisher for
# fopost/fopost-django on PyPI before the first tag. No API token secret.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # Gates publishing behind a dedicated environment, so commit access alone
    # does not grant the ability to push a release to PyPI.
    environment:
      name: pypi
      url: https://pypi.org/p/fopost-django
    permissions:
      contents: read
      id-token: write # PyPI trusted publishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install --upgrade pip build && pip install -e ".[dev]"

      - name: Verify tag matches project version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(python -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          [ "$VERSION" = "$TAG" ] || { echo "::error::pyproject.toml is $VERSION but tag is $TAG"; exit 1; }

      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

      - run: python -m build

      # Catches the class of bug where the wheel builds but the package is
      # unimportable once installed on its own.
      - name: Smoke test the built wheel
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          /tmp/smoke/bin/python -c "
          import django
          from django.conf import settings
          settings.configure(INSTALLED_APPS=['fopost_django'], FOPOST={'API_KEY': 'fp_smoke'}, USE_TZ=True)
          django.setup()
          from fopost_django import get_client, get_settings
          assert get_settings().api_key == 'fp_smoke'
          assert get_client().posts is not None
          print('import ok')
          "

      - name: Publish to PyPI
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
