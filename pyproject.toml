[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fopost-django"
version = "0.1.0"
description = "Official Django integration for the FoPost API. Schedule and publish to +30 social platforms from your Django project."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "FoPost, Porter Bridge, LLC" }]
keywords = [
  "fopost",
  "django",
  "social-media",
  "publishing",
  "scheduling",
  "webhooks",
  "api",
  "sdk",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Framework :: Django",
  "Framework :: Django :: 4.2",
  "Framework :: Django :: 5.0",
  "Framework :: Django :: 5.1",
  "Framework :: Django :: 5.2",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Internet :: WWW/HTTP",
  "Typing :: Typed",
]
dependencies = ["fopost>=0.1,<1.0", "django>=4.2"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-django>=4.8", "ruff>=0.6"]

[project.urls]
Homepage = "https://fopost.com"
Documentation = "https://fopost.com/docs"
Repository = "https://github.com/fopost/fopost-django"
Issues = "https://github.com/fopost/fopost-django/issues"
Support = "https://fopost.com/contact"

[tool.hatch.build.targets.wheel]
packages = ["src/fopost_django"]

[tool.hatch.build.targets.sdist]
include = ["src/fopost_django", "tests", "examples", "README.md", "LICENSE"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
addopts = "-q"
# pytest-django resolves DJANGO_SETTINGS_MODULE before collection puts the rootdir on
# sys.path, so `tests.settings` is unimportable under the bare `pytest` entry point.
# (`python -m pytest` masks this by adding the cwd itself.)
pythonpath = ["."]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]

[tool.ruff.lint.isort]
known-first-party = ["fopost_django", "tests"]
